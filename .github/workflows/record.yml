name: record
on:
  workflow_dispatch:
  push:
    paths: ["forecast/forecasts.csv"]
permissions:
  contents: write
concurrency:
  group: record
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python src/record.py
      - run: tools/commit.sh "stamp market prices on new forecasts"
