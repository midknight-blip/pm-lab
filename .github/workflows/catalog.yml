name: catalog
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths: ["src/catalog.py"]
permissions:
  contents: write
concurrency:
  group: catalog
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python src/catalog.py
      - run: python src/summary.py
      - run: tools/commit.sh "market list refresh"
