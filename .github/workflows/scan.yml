name: scan
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    paths: ["src/scan.py", "src/summary.py"]
permissions:
  contents: write
concurrency:
  group: scan
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: "[ -f arb/pairs_auto.json ] || python src/catalog.py"
      - run: python src/scan.py
      - run: python src/summary.py
      - run: tools/commit.sh "scan"
